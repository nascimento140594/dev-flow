{% extends "tasks/base.html" %}

{% block content %}

<h1>Delete Worker</h1>

<p>Are you sure you want to delete "{{ worker.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">
        Delete
    </button>
</form>

<br>

<a href="{% url 'tasks:worker-list' %}">
    Cancel
</a>

{% endblock %}
