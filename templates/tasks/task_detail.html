{% extends "tasks/base.html" %}

{% block content %}

<h1>{{ task.name }}</h1>

<p>
    <strong>Description:</strong>
    {{ task.description }}
</p>

<p>
    <strong>Status:</strong>
    {{ task.status }}
</p>

<p>
    <strong>Priority:</strong>
    {{ task.priority }}
</p>

<p>
    <strong>Deadline:</strong>
    {{ task.deadline }}
</p>

<a href="{% url 'task-update' task.pk %}">
    Edit
</a>

<a href="{% url 'task-delete' task.pk %}">
    Delete
</a>

{% endblock %}
