{% extends "tasks/base.html" %}

{% block content %}

<h1>Workers</h1>

<a href="{% url 'worker-create' %}">
    Create Worker
</a>

<hr>

<ul>
    {% for worker in workers %}
        <li>
            {{ worker.name }}

            <a href="{% url 'worker-update' pk=worker.id %}">
                Edit
            </a>

            <a href="{% url 'worker-delete' pk=worker.id %}">
                Delete
            </a>
        </li>
    {% empty %}
        <li>No workers found.</li>
    {% endfor %}
</ul>

{% endblock %}
